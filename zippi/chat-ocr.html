<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Chat OCR - Zippi</title>
	<link rel="stylesheet" href="design-system.css">
	<script async src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		body {
			font-family: var(--font-family);
			background-color: var(--bg);
			display: flex;
			height: 100vh;
			overflow: hidden;
		}

		.chat-container {
			display: flex;
			flex-direction: column;
			width: 100%;
			max-width: 600px;
			margin: 0 auto;
			height: 100vh;
			background: var(--white);
			box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
		}

		.chat-header {
			padding: var(--spacing-lg);
			border-bottom: 1px solid var(--border);
			background: var(--white);
			display: flex;
			align-items: center;
			gap: var(--spacing-md);
		}

		.chat-header h2 {
			font-size: var(--font-size-h2);
			color: var(--dark);
			margin: 0;
		}

		.chat-status {
			font-size: var(--font-size-caption);
			color: var(--gray);
		}

		.chat-messages {
			flex: 1;
			overflow-y: auto;
			padding: var(--spacing-lg);
			display: flex;
			flex-direction: column;
			gap: var(--spacing-lg);
		}

		.message {
			display: flex;
			gap: var(--spacing-md);
			animation: slideIn 0.3s ease;
		}

		@keyframes slideIn {
			from {
				opacity: 0;
				transform: translateY(10px);
			}
			to {
				opacity: 1;
				transform: translateY(0);
			}
		}

		.message.sent {
			justify-content: flex-end;
		}

		.message-content {
			max-width: 70%;
		}

		.message.received .message-content {
			background: var(--gray-lighter);
			color: var(--dark);
		}

		.message.sent .message-content {
			background: var(--orange);
			color: var(--white);
		}

		.message-text {
			padding: var(--spacing-md) var(--spacing-lg);
			border-radius: var(--radius-lg);
			word-wrap: break-word;
			font-size: var(--font-size-body);
			line-height: 1.4;
		}

		.message-image {
			max-width: 300px;
			border-radius: var(--radius-lg);
			overflow: hidden;
			margin-bottom: var(--spacing-sm);
		}

		.message-image img {
			width: 100%;
			height: auto;
			display: block;
		}

		.message-time {
			font-size: var(--font-size-caption);
			color: var(--gray);
			margin-top: var(--spacing-sm);
			text-align: right;
		}

		.message.received .message-time {
			text-align: left;
		}

		.message-ocr {
			font-size: var(--font-size-small);
			color: var(--gray);
			margin-top: var(--spacing-md);
			padding: var(--spacing-md);
			background: rgba(255, 165, 0, 0.1);
			border-radius: var(--radius-md);
			border-left: 3px solid var(--orange);
		}

		.ocr-label {
			font-weight: var(--font-weight-bold);
			color: var(--orange);
			margin-bottom: var(--spacing-sm);
		}

		.loading-indicator {
			display: flex;
			gap: var(--spacing-sm);
			align-items: center;
		}

		.loading-dot {
			width: 8px;
			height: 8px;
			border-radius: 50%;
			background: var(--orange);
			animation: bounce 1.4s infinite;
		}

		.loading-dot:nth-child(2) {
			animation-delay: 0.2s;
		}

		.loading-dot:nth-child(3) {
			animation-delay: 0.4s;
		}

		@keyframes bounce {
			0%, 80%, 100% {
				opacity: 0.5;
				transform: translateY(0);
			}
			40% {
				opacity: 1;
				transform: translateY(-10px);
			}
		}

		.chat-input-area {
			padding: var(--spacing-lg);
			border-top: 1px solid var(--border);
			background: var(--white);
		}

		.chat-input-wrapper {
			display: flex;
			gap: var(--spacing-md);
			align-items: flex-end;
		}

		.input-field {
			flex: 1;
			display: flex;
			flex-direction: column;
			gap: var(--spacing-sm);
		}

		.chat-input {
			padding: var(--spacing-md);
			border: 1px solid var(--border);
			border-radius: var(--radius-md);
			font-family: var(--font-family);
			font-size: var(--font-size-body);
			resize: none;
			max-height: 100px;
		}

		.chat-input:focus {
			outline: none;
			border-color: var(--orange);
			box-shadow: 0 0 0 3px rgba(255, 165, 0, 0.1);
		}

		.upload-section {
			display: flex;
			gap: var(--spacing-sm);
			align-items: center;
		}

		.file-input-wrapper {
			position: relative;
			overflow: hidden;
		}

		#imageUpload {
			position: absolute;
			opacity: 0;
			width: 0;
			height: 0;
		}

		.upload-btn {
			display: flex;
			align-items: center;
			justify-content: center;
			width: 48px;
			height: 48px;
			background: var(--gray-lighter);
			border: none;
			border-radius: var(--radius-md);
			cursor: pointer;
			transition: all 0.3s ease;
		}

		.upload-btn:hover {
			background: var(--border);
		}

		.send-btn {
			width: 48px;
			height: 48px;
			padding: 0;
			display: flex;
			align-items: center;
			justify-content: center;
		}

		.image-preview {
			display: flex;
			gap: var(--spacing-sm);
			margin-top: var(--spacing-sm);
			flex-wrap: wrap;
		}

		.image-preview-item {
			position: relative;
			width: 60px;
			height: 60px;
			border-radius: var(--radius-md);
			overflow: hidden;
			border: 2px solid var(--border);
		}

		.image-preview-item img {
			width: 100%;
			height: 100%;
			object-fit: cover;
		}

		.image-preview-remove {
			position: absolute;
			top: 2px;
			right: 2px;
			width: 20px;
			height: 20px;
			background: rgba(0, 0, 0, 0.6);
			color: white;
			border: none;
			border-radius: 50%;
			cursor: pointer;
			font-size: 12px;
			display: flex;
			align-items: center;
			justify-content: center;
		}

		.empty-state {
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			height: 100%;
			color: var(--gray);
			text-align: center;
			padding: var(--spacing-xl);
		}

		.empty-state-icon {
			font-size: 3rem;
			margin-bottom: var(--spacing-lg);
		}

		@media (max-width: 768px) {
			.message-content {
				max-width: 85%;
			}

			.message-image {
				max-width: 250px;
			}
		}
	</style>
</head>
<body>
	<div class="chat-container">
		<!-- Header -->
		<div class="chat-header">
			<div>
				<h2>Chat OCR</h2>
				<p class="chat-status">Envie fotos e extraia texto automaticamente</p>
			</div>
		</div>

		<!-- Messages -->
		<div class="chat-messages" id="messagesContainer">
			<div class="empty-state">
				<div class="empty-state-icon">💬</div>
				<p>Envie uma mensagem ou imagem para começar</p>
			</div>
		</div>

		<!-- Input -->
		<div class="chat-input-area">
			<div class="input-field">
				<textarea
					class="chat-input"
					id="messageInput"
					placeholder="Digite uma mensagem..."
					rows="1"
				></textarea>
				<div class="image-preview" id="imagePreview"></div>
			</div>

			<div class="chat-input-wrapper">
				<div class="upload-section">
					<div class="file-input-wrapper">
						<input
							type="file"
							id="imageUpload"
							accept="image/*"
							multiple
						/>
						<button class="upload-btn" onclick="document.getElementById('imageUpload').click()">
							<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
								<rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
								<circle cx="8.5" cy="8.5" r="1.5"/>
								<path d="M21 15l-5-5L5 21"/>
							</svg>
						</button>
					</div>
				</div>
				<button class="btn btn-primary send-btn" id="sendBtn">
					<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
						<path d="M16.6915026,12.4744748 L3.50612381,13.2599618 C3.19218622,13.2599618 3.03521743,13.4170592 3.03521743,13.5741566 L1.15159189,20.0151496 C0.8376543,20.8006365 0.99,21.89 1.77946707,22.52 C2.41,22.99 3.50612381,23.1 4.13399899,22.8429026 L21.714504,14.0454487 C22.6563168,13.5741566 23.1272231,12.6315722 22.9702544,11.6889879 L4.13399899,1.16346272 C3.34915502,0.9 2.40734225,1.00636533 1.77946707,1.4776575 C0.994623095,2.10604706 0.837654326,3.0486314 1.15159189,3.99101575 L3.03521743,10.4319088 C3.03521743,10.5890061 3.34915502,10.7461035 3.50612381,10.7461035 L16.6915026,11.5315905 C16.6915026,11.5315905 17.1624089,11.5315905 17.1624089,12.0028827 C17.1624089,12.4744748 16.6915026,12.4744748 16.6915026,12.4744748 Z"/>
					</svg>
				</button>
			</div>
		</div>
	</div>

	<script>
		const messagesContainer = document.getElementById('messagesContainer');
		const messageInput = document.getElementById('messageInput');
		const imageUpload = document.getElementById('imageUpload');
		const sendBtn = document.getElementById('sendBtn');
		const imagePreview = document.getElementById('imagePreview');

		let selectedImages = [];

		// Auto-resize textarea
		messageInput.addEventListener('input', function() {
			this.style.height = 'auto';
			this.style.height = Math.min(this.scrollHeight, 100) + 'px';
		});

		// Handle image upload
		imageUpload.addEventListener('change', function(e) {
			const files = Array.from(e.target.files);
			selectedImages = selectedImages.concat(files);
			updateImagePreview();
		});

		function updateImagePreview() {
			imagePreview.innerHTML = '';
			selectedImages.forEach((file, index) => {
				const reader = new FileReader();
				reader.onload = function(e) {
					const item = document.createElement('div');
					item.className = 'image-preview-item';
					item.innerHTML = `
						<img src="${e.target.result}" alt="Preview">
						<button class="image-preview-remove" onclick="removeImage(${index})">×</button>
					`;
					imagePreview.appendChild(item);
				};
				reader.readAsDataURL(file);
			});
		}

		function removeImage(index) {
			selectedImages.splice(index, 1);
			updateImagePreview();
		}

		// Send message
		sendBtn.addEventListener('click', sendMessage);
		messageInput.addEventListener('keypress', function(e) {
			if (e.key === 'Enter' && !e.shiftKey) {
				e.preventDefault();
				sendMessage();
			}
		});

		function sendMessage() {
			const text = messageInput.value.trim();

			if (!text && selectedImages.length === 0) return;

			// Clear input
			if (text) {
				addMessage(text, 'sent', null);
				messageInput.value = '';
				messageInput.style.height = 'auto';
			}

			// Process images
			selectedImages.forEach(file => {
				const reader = new FileReader();
				reader.onload = function(e) {
					addMessage(null, 'sent', e.target.result);
					processOCR(e.target.result);
				};
				reader.readAsDataURL(file);
			});

			selectedImages = [];
			updateImagePreview();
		}

		function addMessage(text, type, imageData) {
			if (messagesContainer.querySelector('.empty-state')) {
				messagesContainer.innerHTML = '';
			}

			const message = document.createElement('div');
			message.className = `message ${type}`;

			const time = new Date().toLocaleTimeString('pt-BR', {
				hour: '2-digit',
				minute: '2-digit'
			});

			let content = `<div class="message-content">`;

			if (imageData) {
				content += `<div class="message-image"><img src="${imageData}" alt="User image"></div>`;
			}

			if (text) {
				content += `<div class="message-text">${escapeHtml(text)}</div>`;
			}

			content += `<div class="message-time">${time}</div>`;
			content += `</div>`;

			message.innerHTML = content;
			messagesContainer.appendChild(message);
			messagesContainer.scrollTop = messagesContainer.scrollHeight;
		}

		async function processOCR(imageData) {
			const botMessage = document.createElement('div');
			botMessage.className = 'message received';
			botMessage.innerHTML = `
				<div class="message-content">
					<div class="message-text">
						<div class="loading-indicator">
							<div class="loading-dot"></div>
							<div class="loading-dot"></div>
							<div class="loading-dot"></div>
						</div>
					</div>
				</div>
			`;
			messagesContainer.appendChild(botMessage);
			messagesContainer.scrollTop = messagesContainer.scrollHeight;

			try {
				const result = await Tesseract.recognize(
					imageData,
					'por', // Portuguese
					{
						logger: m => console.log(m)
					}
				);

				const text = result.data.text.trim();

				if (!text) {
					botMessage.querySelector('.message-text').innerHTML =
						'<div class="message-ocr"><div class="ocr-label">📸 OCR</div>Nenhum texto detectado na imagem</div>';
				} else {
					botMessage.querySelector('.message-text').innerHTML =
						`<div class="message-ocr"><div class="ocr-label">📸 Texto detectado:</div>${escapeHtml(text)}</div>`;
				}

				const time = new Date().toLocaleTimeString('pt-BR', {
					hour: '2-digit',
					minute: '2-digit'
				});
				botMessage.querySelector('.message-content').innerHTML +=
					`<div class="message-time">${time}</div>`;
			} catch (error) {
				console.error('OCR Error:', error);
				botMessage.querySelector('.message-text').innerHTML =
					'<div class="message-ocr"><div class="ocr-label">❌ Erro</div>Não consegui processar a imagem. Tente outra.</div>';
			}

			messagesContainer.scrollTop = messagesContainer.scrollHeight;
		}

		function escapeHtml(text) {
			const div = document.createElement('div');
			div.textContent = text;
			return div.innerHTML;
		}
	</script>
</body>
</html>
