<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Zippi - App Hub</title>
	<link rel="stylesheet" href="design-system.css">
	<style>
		body {
			background: var(--bg);
			display: flex;
			align-items: center;
			justify-content: center;
			min-height: 100vh;
			padding: var(--spacing-lg);
		}

		.hub-container {
			max-width: 800px;
			width: 100%;
		}

		.hub-header {
			text-align: center;
			margin-bottom: var(--spacing-2xl);
		}

		.hub-header h1 {
			font-size: var(--font-size-h1);
			color: var(--dark);
			margin-bottom: var(--spacing-md);
		}

		.hub-header p {
			font-size: var(--font-size-body);
			color: var(--gray);
			margin: 0;
		}

		.apps-grid {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
			gap: var(--spacing-xl);
			margin-bottom: var(--spacing-2xl);
		}

		.app-card {
			background: var(--white);
			border-radius: var(--radius-lg);
			padding: var(--spacing-xl);
			text-align: center;
			cursor: pointer;
			transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
			border: 2px solid transparent;
			text-decoration: none;
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: var(--spacing-lg);
			box-shadow: var(--shadow-sm);
		}

		.app-card:hover {
			transform: translateY(-8px);
			box-shadow: var(--shadow-lg);
			border-color: var(--orange);
		}

		.app-icon {
			font-size: 4rem;
		}

		.app-card h2 {
			font-size: var(--font-size-h2);
			color: var(--dark);
			margin: 0;
		}

		.app-card p {
			font-size: var(--font-size-body);
			color: var(--gray);
			margin: 0;
		}

		.app-card .cta {
			display: inline-block;
			background: var(--orange);
			color: var(--white);
			padding: var(--spacing-md) var(--spacing-lg);
			border-radius: var(--radius-full);
			font-weight: var(--font-weight-bold);
			margin-top: var(--spacing-md);
			transition: all 0.3s ease;
		}

		.app-card:hover .cta {
			background: var(--orange-dark);
			box-shadow: 0 8px 16px rgba(255, 165, 0, 0.3);
		}

		.hub-footer {
			text-align: center;
			color: var(--gray);
			font-size: var(--font-size-small);
		}

		@media (max-width: 768px) {
			.apps-grid {
				grid-template-columns: 1fr;
			}

			.hub-header h1 {
				font-size: var(--font-size-h2);
			}
		}
	</style>
</head>
<body>
	<div class="hub-container">
		<div class="hub-header">
			<h1>🚀 Zippi Apps</h1>
			<p>Escolha um app para começar</p>
		</div>

		<div class="apps-grid">
			<!-- WhatsApp App -->
			<a href="whatsapp.html" class="app-card">
				<div class="app-icon">💬</div>
				<h2>WhatsApp Web</h2>
				<p>Interface de chat tipo WhatsApp com OCR integrado</p>
				<span class="cta">Abrir App →</span>
			</a>

			<!-- Zippi App -->
			<a href="index-app.html" class="app-card">
				<div class="app-icon">💰</div>
				<h2>Zippi</h2>
				<p>App de capital de giro para microempreendedores</p>
				<span class="cta">Abrir App →</span>
			</a>
		</div>

		<div class="hub-footer">
			<p>💡 Todos os apps funcionam localmente, sem servidor necessário</p>
		</div>
	</div>
</body>
</html>
