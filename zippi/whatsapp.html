<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>WhatsApp Web - OCR Chat</title>
	<style>
		* { margin: 0; padding: 0; box-sizing: border-box; }
		html, body { height: 100%; }
		body {
			font-family: 'Segoe UI', Helvetica, Arial, sans-serif;
			background: #d1d7db;
			display: flex;
			height: 100vh;
			overflow: hidden;
			color: #111b21;
		}

		.whatsapp-container { display: flex; width: 100%; height: 100vh; background: #fff; }

		/* ICON RAIL */
		.rail {
			width: 68px;
			background: #f0f2f5;
			display: flex;
			flex-direction: column;
			align-items: center;
			padding: 12px 0;
			border-right: 1px solid #d1d7db;
			flex-shrink: 0;
		}
		.rail-top { display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1; }
		.rail-bottom { display: flex; flex-direction: column; align-items: center; gap: 4px; }
		.rail-item {
			width: 42px; height: 42px; border-radius: 8px;
			display: flex; align-items: center; justify-content: center;
			color: #54656f; cursor: pointer; position: relative; background: transparent;
			border: none;
		}
		.rail-item:hover { background: #e9edef; }
		.rail-item.active { background: #d9dbdf; color: #000; }
		.rail-badge {
			position: absolute; top: 2px; right: 2px;
			background: #00a884; color: #fff; font-size: 10px; font-weight: 600;
			min-width: 16px; height: 16px; border-radius: 8px;
			display: flex; align-items: center; justify-content: center; padding: 0 3px;
		}
		.rail-avatar {
			width: 32px; height: 32px; border-radius: 50%; overflow: hidden;
			background: #128c7e; display: flex; align-items: center; justify-content: center;
			color: #fff; font-size: 14px; font-weight: 600;
		}
		.rail-avatar img { width: 100%; height: 100%; object-fit: cover; }

		/* SIDEBAR */
		.sidebar { width: 400px; background: #fff; display: flex; flex-direction: column; height: 100vh; flex-shrink: 0; border-right: 1px solid #d1d7db; }
		.sidebar-header { padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; }
		.sidebar-header h1 { font-size: 22px; color: #111b21; font-weight: 400; }
		.sidebar-actions { display: flex; gap: 4px; align-items: center; }
		.icon-btn {
			width: 40px; height: 40px; border-radius: 50%; background: transparent; border: none;
			cursor: pointer; display: flex; align-items: center; justify-content: center;
			transition: background 0.15s; color: #54656f; flex-shrink: 0;
		}
		.icon-btn:hover { background: #f0f2f5; }
		.back-link {
			font-size: 12px; color: #008069; text-decoration: none; padding: 6px 10px;
			border-radius: 6px; font-weight: 600;
		}
		.back-link:hover { background: #f0f2f5; }

		.search-box { padding: 6px 12px 8px; }
		.search-wrap { position: relative; }
		.search-input {
			width: 100%; padding: 8px 12px 8px 40px; border: none; border-radius: 8px;
			font-size: 14px; background: #f0f2f5; color: #111b21;
		}
		.search-input::placeholder { color: #667781; }
		.search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #54656f; display: flex; }

		.filters { display: flex; gap: 8px; padding: 0 12px 8px; overflow-x: auto; }
		.filter-chip {
			padding: 6px 14px; border-radius: 16px; font-size: 13px; font-weight: 500;
			background: #f0f2f5; color: #54656f; border: none; cursor: pointer; white-space: nowrap;
			flex-shrink: 0;
		}
		.filter-chip.active { background: #d9fdd3; color: #008069; }
		.filter-chip.plus { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; padding: 0; }

		.sync-banner {
			margin: 4px 12px 8px; background: #d9fdd3; border-radius: 10px; padding: 12px 14px;
			display: flex; gap: 12px; align-items: flex-start; position: relative;
		}
		.sync-banner svg.refresh { color: #008069; flex-shrink: 0; margin-top: 2px; }
		.sync-banner strong { font-size: 13px; color: #111b21; display: block; margin-bottom: 2px; }
		.sync-banner p { font-size: 12px; color: #3b4a54; line-height: 1.4; }
		.sync-banner a { color: #008069; font-weight: 600; text-decoration: none; }
		.sync-close { position: absolute; top: 10px; right: 10px; color: #54656f; cursor: pointer; background: none; border: none; }

		.conversations { flex: 1; overflow-y: auto; }
		.conversation {
			display: flex; align-items: center; gap: 15px; padding: 12px 15px; cursor: pointer;
			border-bottom: 1px solid #f0f2f5;
		}
		.conversation:hover { background: #f5f6f6; }
		.conversation.active { background: #f0f2f5; }
		.avatar {
			width: 49px; height: 49px; border-radius: 50%; background: #128c7e;
			display: flex; align-items: center; justify-content: center; color: #fff;
			font-weight: 600; font-size: 1.2rem; flex-shrink: 0; overflow: hidden;
		}
		.avatar img { width: 100%; height: 100%; object-fit: cover; }
		.conversation-info { flex: 1; min-width: 0; }
		.conversation-row-top { display: flex; justify-content: space-between; align-items: baseline; }
		.conversation-name { font-weight: 400; color: #111b21; font-size: 16px; }
		.conversation-time { font-size: 12px; color: #667781; }
		.conversation-row-bottom { display: flex; justify-content: space-between; align-items: center; margin-top: 2px; }
		.conversation-preview {
			font-size: 14px; color: #667781; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
			display: flex; align-items: center; gap: 4px;
		}

		/* CHAT AREA */
		.chat-area { flex: 1; display: flex; flex-direction: column; background: #efeae2; min-width: 0; }
		.chat-header {
			padding: 10px 16px; display: flex; justify-content: space-between; align-items: center;
			background: #f0f2f5; height: 59px; flex-shrink: 0;
		}
		.chat-header-info { display: flex; align-items: center; gap: 15px; cursor: pointer; }
		.chat-header-avatar {
			width: 40px; height: 40px; border-radius: 50%; background: #128c7e;
			display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 600; overflow: hidden;
		}
		.chat-header-avatar img { width: 100%; height: 100%; object-fit: cover; }
		.chat-header-text h2 { font-size: 16px; color: #111b21; font-weight: 400; }
		.chat-header-text p { font-size: 13px; color: #667781; }
		.chat-header-actions { display: flex; gap: 4px; align-items: center; }

		/* MESSAGES */
		.messages {
			flex: 1; overflow-y: auto; padding: 20px 5%;
			background-color: #efeae2;
			background-image:
				radial-gradient(circle at 12px 12px, rgba(0,0,0,0.025) 1.4px, transparent 1.4px),
				radial-gradient(circle at 34px 34px, rgba(0,0,0,0.02) 1.2px, transparent 1.2px);
			background-size: 46px 46px;
			display: flex; flex-direction: column; gap: 2px;
		}
		.message { display: flex; animation: slideIn 0.15s ease; }
		@keyframes slideIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
		.message.sent { justify-content: flex-end; }
		.message-content { max-width: 65%; }
		.message-bubble {
			padding: 6px 9px; border-radius: 7.5px; word-wrap: break-word; font-size: 14.2px;
			line-height: 19px; box-shadow: 0 1px 0.5px rgba(11,20,26,0.13); position: relative;
		}
		.message.received .message-bubble { background: #ffffff; color: #111b21; border-top-left-radius: 0; }
		.message.sent .message-bubble { background: #d9fdd3; color: #111b21; border-top-right-radius: 0; }
		.msg-meta {
			display: flex; justify-content: flex-end; align-items: center; gap: 3px;
			font-size: 11px; color: rgba(0,0,0,0.45); margin-top: 2px; margin-left: 8px; float: right;
		}
		.msg-meta svg { display: block; }
		.message-image { max-width: 280px; border-radius: 6px; overflow: hidden; margin-bottom: 4px; }
		.message-image img { width: 100%; height: auto; display: block; }
		.ocr-text { background: rgba(0, 0, 0, 0.04); padding: 8px; border-radius: 8px; margin-top: 4px; font-size: 13px; }
		.loading { display: inline-flex; gap: 4px; align-items: center; padding: 2px 4px; }
		.loading-dot { width: 7px; height: 7px; border-radius: 50%; background: #8696a0; animation: bounce 1.4s infinite; }
		.loading-dot:nth-child(2) { animation-delay: 0.2s; }
		.loading-dot:nth-child(3) { animation-delay: 0.4s; }
		@keyframes bounce { 0%, 80%, 100% { opacity: 0.5; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-4px); } }

		/* INPUT */
		.input-area { padding: 10px 16px; background: #f0f2f5; display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
		.input-btn {
			width: 40px; height: 40px; border-radius: 50%; background: transparent; border: none;
			cursor: pointer; display: flex; align-items: center; justify-content: center;
			transition: background 0.15s; color: #54656f; flex-shrink: 0;
		}
		.input-btn:hover { background: #e9edef; }
		.message-input {
			flex: 1; padding: 9px 12px; border: none; border-radius: 8px; font-family: inherit;
			font-size: 15px; resize: none; max-height: 100px; background: #fff; color: #111b21;
			line-height: 20px;
		}
		.message-input:focus { outline: none; }
		.send-btn {
			width: 40px; height: 40px; padding: 0; background: transparent; color: #54656f;
			border: none; border-radius: 50%; cursor: pointer; display: flex; align-items: center;
			justify-content: center; transition: background 0.15s; flex-shrink: 0;
		}
		.send-btn:hover { background: #e9edef; }
		#imageUpload { display: none; }

		.conversations::-webkit-scrollbar, .messages::-webkit-scrollbar { width: 6px; }
		.conversations::-webkit-scrollbar-thumb, .messages::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 3px; }
	</style>
</head>
<body>
	<div class="whatsapp-container">
		<!-- ICON RAIL -->
		<div class="rail">
			<div class="rail-top">
				<button class="rail-item active">
					<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M19.005 3.175H4.674C3.75 3.175 3 3.925 3 4.849v14.326l3.671-3.98h12.334c.924 0 1.674-.75 1.674-1.674V4.849c0-.924-.75-1.674-1.674-1.674zm-4.343 8.481H7.29c-.35 0-.633-.283-.633-.633s.283-.633.633-.633h7.372c.349 0 .633.283.633.633s-.284.633-.633.633zm2.462-3.271H7.29c-.349 0-.633-.283-.633-.632 0-.35.283-.633.633-.633h9.833c.349 0 .633.283.633.633 0 .35-.284.632-.633.632z"/></svg>

				<button class="rail-item">

				<a href="index.html" class="rail-avatar" title="Voltar ao hub">A</a>
			</div>
		</div>

		<!-- SIDEBAR -->
		<div class="sidebar">
			<div class="sidebar-header">
				<h1>WhatsApp</h1>
				<div class="sidebar-actions">
					<button class="icon-btn" title="Nova conversa"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
					<button class="icon-btn" title="Menu"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg></button>
				</div>
			</div>

			<div class="search-box">
				<div class="search-wrap">
					<span class="search-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></span>
					<input type="text" class="search-input" placeholder="Pesquisar ou começar uma nova conversa">
				</div>
			</div>

			<div class="filters">
				<button class="filter-chip active">Tudo</button>
				<button class="filter-chip">Não lidas</button>
				<button class="filter-chip">Favoritas</button>
				<button class="filter-chip">Grupos</button>
			</div>

			<div class="conversations">
				<div class="conversation active">

							<span class="conversation-preview">Oi! Tudo bem sim! E você? 😊</span>
						</div>

		<!-- CHAT AREA -->
		<div class="chat-area">
			<!-- Header -->
			<div class="chat-header">
				<div class="chat-header-info">
					<div class="chat-header-avatar"><img src="../img/app-icon_acai.png" alt="ziza" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><span style="display: none;">Z</span></div>

						<p>online</p>
					</div>
				</div>
				<div class="chat-header-actions">
					<button class="icon-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg></button>
					<button class="icon-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg></button>

				</div>
			</div>

			<!-- Messages -->
			<div class="messages" id="messagesContainer">
				<div class="message received">
					<div class="message-content">
						<div class="message-bubble">Oi! Tudo bem? 👋<span class="msg-meta">14:30</span></div>
					</div>
				</div>
				<div class="message sent">
					<div class="message-content">
						<div class="message-bubble">Oi! Tudo bem sim! E você? 😊<span class="msg-meta">14:31 <svg width="16" height="11" viewBox="0 0 16 11" fill="none"><path d="M11.071.653a.457.457 0 0 0-.304-.102.493.493 0 0 0-.381.178l-6.19 7.636-2.405-2.272a.463.463 0 0 0-.336-.146.47.47 0 0 0-.343.146l-.291.312a.44.44 0 0 0-.14.325c0 .126.047.24.14.325l2.939 2.77a.628.628 0 0 0 .451.19c.183 0 .33-.062.44-.19l6.735-8.33a.464.464 0 0 0 .102-.324.457.457 0 0 0-.146-.324z" fill="#53bdeb"/><path d="M15.071.653a.457.457 0 0 0-.304-.102.493.493 0 0 0-.381.178l-6.19 7.636-1.34-1.264-.626.773 1.815 1.71a.628.628 0 0 0 .45.19c.184 0 .33-.062.44-.19l6.735-8.33a.464.464 0 0 0 .102-.324.457.457 0 0 0-.146-.324z" fill="#53bdeb"/></svg></span></div>

				<input type="file" id="imageUpload" accept="image/*">
				<textarea class="message-input" id="messageInput" placeholder="Digite uma mensagem" rows="1"></textarea>
				<button class="send-btn" id="sendBtn" onclick="sendMessage()">
					<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M1.101 21.757 23.8 12.028 1.101 2.3l.011 7.912 13.623 1.816-13.623 1.817-.011 7.912z"/></svg>
				</button>
			</div>
		</div>
	</div>

	<script>
		const messagesContainer = document.getElementById('messagesContainer');
		const messageInput = document.getElementById('messageInput');
		const imageUpload = document.getElementById('imageUpload');
		const conversationPreview = document.querySelector('.conversation-preview');
		const conversationTime = document.querySelector('.conversation-time');

		messageInput.addEventListener('input', function() {
			this.style.height = 'auto';
			this.style.height = Math.min(this.scrollHeight, 100) + 'px';
		});

		messageInput.addEventListener('keypress', function(e) {
			if (e.key === 'Enter' && !e.shiftKey) {
				e.preventDefault();
				sendMessage();
			}
		});

		imageUpload.addEventListener('change', function(e) {
			const file = e.target.files[0];
			if (!file) return;

			if (!getApiKey()) {
				promptForApiKey();
				if (!getApiKey()) {
					imageUpload.value = '';
					return;
				}
			}

			const reader = new FileReader();
			reader.onload = function(e) {
				addMessage(null, 'sent', e.target.result);
				processOCR(e.target.result);
			};
			reader.readAsDataURL(file);
			imageUpload.value = '';
		});

		function sendMessage() {
			const text = messageInput.value.trim();
			if (!text) return;

			addMessage(text, 'sent', null);
			messageInput.value = '';
			messageInput.style.height = 'auto';

			setTimeout(() => {
				addMessage('Que legal! 😄', 'received', null);
			}, 2000);
		}

		function ticksSvg() {
			return '<svg width="16" height="11" viewBox="0 0 16 11" fill="none"><path d="M11.071.653a.457.457 0 0 0-.304-.102.493.493 0 0 0-.381.178l-6.19 7.636-2.405-2.272a.463.463 0 0 0-.336-.146.47.47 0 0 0-.343.146l-.291.312a.44.44 0 0 0-.14.325c0 .126.047.24.14.325l2.939 2.77a.628.628 0 0 0 .451.19c.183 0 .33-.062.44-.19l6.735-8.33a.464.464 0 0 0 .102-.324.457.457 0 0 0-.146-.324z" fill="#53bdeb"/><path d="M15.071.653a.457.457 0 0 0-.304-.102.493.493 0 0 0-.381.178l-6.19 7.636-1.34-1.264-.626.773 1.815 1.71a.628.628 0 0 0 .45.19c.184 0 .33-.062.44-.19l6.735-8.33a.464.464 0 0 0 .102-.324.457.457 0 0 0-.146-.324z" fill="#53bdeb"/></svg>';
		}

		function addMessage(text, type, imageData) {
			const message = document.createElement('div');
			message.className = `message ${type}`;

			const time = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
			const meta = `<span class="msg-meta">${time}${type === 'sent' ? ' ' + ticksSvg() : ''}</span>`;
			let content = `<div class="message-content">`;

			if (imageData) {
				content += `<div class="message-bubble"><div class="message-image"><img src="${imageData}" alt=""></div>${meta}</div>`;
			} else if (text) {
				content += `<div class="message-bubble">${escapeHtml(text)}${meta}</div>`;
			}

			content += `</div>`;

			message.innerHTML = content;
			messagesContainer.appendChild(message);
			messagesContainer.scrollTop = messagesContainer.scrollHeight;

			if (conversationPreview) conversationPreview.textContent = imageData ? '📷 Foto' : text;
			if (conversationTime) conversationTime.textContent = time;
		}

		const GCV_STORAGE_KEY = 'gcv_api_key';

		function getApiKey() {
			return localStorage.getItem(GCV_STORAGE_KEY) || '';
		}

		function promptForApiKey() {
			const current = getApiKey();
			const key = prompt('Cole sua chave da Google Cloud Vision API:', current);
			if (key === null) return;
			if (key.trim()) {
				localStorage.setItem(GCV_STORAGE_KEY, key.trim());
				alert('Chave salva neste navegador.');
			} else {
				localStorage.removeItem(GCV_STORAGE_KEY);
			}
		}

		async function recognizeWithGoogleVision(imageData) {
			const apiKey = getApiKey();
			if (!apiKey) {
				throw new Error('Nenhuma chave da Google Cloud Vision API configurada. Clique no ícone de chave ao lado do clipe para configurar.');
			}

			const base64 = imageData.split(',')[1];
			const response = await fetch(`https://vision.googleapis.com/v1/images:annotate?key=${apiKey}`, {
				method: 'POST',
				headers: { 'Content-Type': 'application/json' },
				body: JSON.stringify({
					requests: [{
						image: { content: base64 },
						features: [{ type: 'DOCUMENT_TEXT_DETECTION' }],
						imageContext: { languageHints: ['pt'] }
					}]
				})
			});

			const data = await response.json();
			const apiResult = data.responses && data.responses[0];

			if (!response.ok || (apiResult && apiResult.error)) {
				const message = (apiResult && apiResult.error && apiResult.error.message)
					|| (data.error && data.error.message)
					|| `Falha ao consultar a Google Cloud Vision API (HTTP ${response.status})`;
				throw new Error(message);
			}

			return (apiResult && apiResult.fullTextAnnotation && apiResult.fullTextAnnotation.text || '').trim();
		}

		async function processOCR(imageData) {
			const botMessage = document.createElement('div');
			botMessage.className = 'message received';
			botMessage.innerHTML = `<div class="message-content"><div class="message-bubble"><div class="loading"><div class="loading-dot"></div><div class="loading-dot"></div><div class="loading-dot"></div></div></div></div>`;
			messagesContainer.appendChild(botMessage);
			messagesContainer.scrollTop = messagesContainer.scrollHeight;

			try {
				const text = await recognizeWithGoogleVision(imageData);
				const time = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
				const meta = `<span class="msg-meta">${time}</span>`;

				if (!text) {
					botMessage.querySelector('.message-bubble').innerHTML = `<div class="ocr-text"><strong>📸 OCR:</strong> Nenhum texto detectado</div>${meta}`;
				} else {
					botMessage.querySelector('.message-bubble').innerHTML = `<div class="ocr-text"><strong>📸 Texto encontrado:</strong><br>${escapeHtml(text)}</div>${meta}`;
				}
				if (conversationPreview) conversationPreview.textContent = text ? '📸 ' + text.slice(0, 30) : '📸 OCR';
				if (conversationTime) conversationTime.textContent = time;
			} catch (error) {
				botMessage.querySelector('.message-bubble').innerHTML = `<div class="ocr-text">❌ ${escapeHtml(error.message || 'Erro ao processar imagem')}</div>`;
			}

			messagesContainer.scrollTop = messagesContainer.scrollHeight;
		}

		function escapeHtml(text) {
			const div = document.createElement('div');
			div.textContent = text;
			return div.innerHTML;
		}
	</script>
</body>
</html>
